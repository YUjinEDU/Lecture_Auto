<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공유·복습 자료</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="manage.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../">Lecture Auto <span>스튜디오</span></a>
    <nav><a href="../">강의 목록</a></nav>
  </header>
  <main class="m-main">
    <h1 id="m-title">공유·복습 자료</h1>
    <p id="m-error" class="m-error" hidden></p>

    <section class="m-card">
      <h2>학생 공유 링크</h2>
      <p class="m-muted">링크를 받은 사람은 로그인 없이 이 강의 하나만 볼 수 있습니다. 회수하면 바로 막힙니다.</p>
      <button id="share-new" class="m-primary">새 공유 링크 만들기</button>
      <ul id="share-list" class="m-shares"></ul>
    </section>

    <section class="m-card">
      <h2>용어·퀴즈</h2>
      <p class="m-muted">대본으로 초안을 만든 뒤, 고치고 <b>공개</b>에 체크한 항목만 학생에게 보입니다. 초안을 다시 만들어도 공개한 항목은 남습니다.</p>
      <div class="m-row">
        <button id="study-draft">초안 만들기</button>
        <span id="study-job" class="m-muted"></span>
        <span class="m-grow"></span>
        <button id="study-save" class="m-primary">저장</button>
      </div>
      <p id="study-msg" class="m-muted"></p>
      <h3>용어 <button id="g-add" class="m-small">+ 추가</button></h3>
      <div id="glossary"></div>
      <h3>퀴즈 <button id="q-add" class="m-small">+ 추가</button></h3>
      <div id="quiz"></div>
    </section>
  </main>
  <script src="manage.js"></script>
</body>
</html>
