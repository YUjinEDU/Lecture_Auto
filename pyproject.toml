[project]
name = "lecture-auto"
version = "0.1.0"
description = "Lecture automation pipeline - PPTX to script and audio"
requires-python = ">=3.11"
dependencies = [
    "pillow>=11.0",
    "numpy>=1.26",
    "pdf2image>=1.17",
    "python-pptx>=1.0.2",
    "fastapi>=0.135.1",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "supabase>=2.28.3",
    "soundfile>=0.13.1",
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0",
    "sse-starlette>=2.0",
    "pymupdf>=1.27",
    "pdfplumber>=0.11",
    "zipstream-ng>=1.9.0",
    "python-multipart>=0.0.22",
    "openai>=1.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# GPU stack for Raon-Speech-9B (TTS) local inference. Not required to run the
# test suite or the API/CLI text paths -- only for scripts/batch_generate_lectures.py
# and the *_mini_test*.py scripts that actually load the model.
# ponytail: `uv sync` without --all-extras prunes these from .venv (bit us once
# already, see AGENTS.md). Always run `uv sync --all-extras` on this project.
gpu = [
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "transformers>=4.57.1,<5.0",  # Raon-Speech-9B model card pins <5.0 (dynamic trust_remote_code loading)
    "accelerate",
    "speechbrain>=1.1",
    "scipy",
    "sentencepiece",
    "pyloudnorm>=0.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
