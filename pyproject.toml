[project]
name = "lecture-auto"
version = "0.1.4"
description = "Turn lecture slides (PPTX/PDF) into reviewable scripts, natural voice-over and a finished lecture video"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["lecture", "education", "tts", "llm", "pptx", "video", "e-learning"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "pillow>=11.0",
    "numpy>=1.26",
    "pdf2image>=1.17",
    "python-pptx>=1.0.2",
    "fastapi>=0.135.1",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "soundfile>=0.13.1",
    "pymupdf>=1.27",
    "pdfplumber>=0.11",
    "python-multipart>=0.0.22",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "pyloudnorm>=0.2.0",
    "scipy",
    "cryptography>=46.0",
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/YUjinEDU/Lecture_Auto"
Issues = "https://github.com/YUjinEDU/Lecture_Auto/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# GPU stack for Raon-Speech-9B (TTS) local inference. Not required to run the
# test suite or the API/CLI text paths -- only for scripts/batch_generate_lectures.py
# and the *_mini_test*.py scripts that actually load the model.
# ponytail: `uv sync` without --all-extras prunes these from .venv (bit us once
# already, see AGENTS.md). Always run `uv sync --all-extras` on this project.
gpu = [
    "torch==2.5.1+cu121",
    "torchaudio==2.5.1+cu121",
    "transformers>=4.57.1,<5.0",  # Raon-Speech-9B model card pins <5.0 (dynamic trust_remote_code loading)
    "accelerate",
    "speechbrain>=1.1",
    "scipy",
    "sentencepiece",
]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data", "output", "results", "review", "logs", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E731", "E741", "E701", "E702", "B008", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "B017", "E402"]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
